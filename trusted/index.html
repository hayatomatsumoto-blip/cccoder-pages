<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCCOder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" allow="fullscreen"></iframe>
  <script>
    // 一般用と同じ匿名デプロイ。trustedKey でパスコード省略。Google直リンクは使わない（バナー回避）。
    var GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbwZGNZEb05lpLeYHhmTB9B386I9rMFhB8ihCs0j1C4E4sBxhtTn179IWyyRwJXJqctP/exec';
    var TRUSTED_ENTRY_KEY = '1mA1sKpNUSN7rj-6t3IkRe16w881YzKB';
    var TOKEN_STORAGE_KEY = 'cccoder_auth_token_trusted';
    var frame = document.getElementById('app-frame');

    function getStoredToken() {
      try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function storeToken(token) {
      try { localStorage.setItem(TOKEN_STORAGE_KEY, token); } catch (e) {}
    }
    function buildFrameUrl() {
      var params = [];
      params.push('trustedKey=' + encodeURIComponent(TRUSTED_ENTRY_KEY));
      var token = getStoredToken();
      if (token) params.push('authToken=' + encodeURIComponent(token));
      return GAS_BASE_URL + '?' + params.join('&');
    }

    frame.src = buildFrameUrl();

    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'cccoderAuthToken') return;
      if (typeof event.origin === 'string' && event.origin.indexOf('googleusercontent.com') === -1 && event.origin !== 'https://script.google.com') {
        return;
      }
      if (event.data.token) storeToken(event.data.token);
    });
  </script>
</body>
</html>

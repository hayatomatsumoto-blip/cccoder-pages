<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCCOder（信頼ログイン）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
    }
    .boot {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #0d0d0d;
      z-index: 2;
    }
    .boot.show { display: flex; }
    .card {
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .card h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .card p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cfcfcf;
      margin-bottom: 20px;
    }
    .card a, .card button {
      display: inline-block;
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 8px;
      background: #2f6fed;
      color: #fff;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
    }
    .card .secondary {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #555;
      color: #ddd;
    }
  </style>
</head>
<body>
  <div id="boot" class="boot show">
    <div class="card">
      <h1>CCCOder 信頼ログイン</h1>
      <p>初回は Google アカウント（登録済みメール）で認証してください。認証後、このページをホーム画面に追加すると、パスコードなし・Googleバナーなしで開けます。</p>
      <a id="google-open" href="#">Googleアカウントで開く</a>
      <button id="retry-iframe" class="secondary" type="button">認証済みの場合はこちら</button>
    </div>
  </div>
  <iframe id="app-frame" allow="fullscreen" style="display:none"></iframe>

  <script>
    // 信頼用デプロイ（ANYONE）。一般用とは別URL。修正時は一般用と両方版上げすること。
    var GAS_BASE_URL = 'https://script.google.com/macros/s/AKfycbyFr19iClFz4bb7_i4R-OuQrwCojPQ13jr2Vgw_61SnA56qX3_29PEc_WYXgXvvNnbF/exec';
    var TOKEN_STORAGE_KEY = 'cccoder_auth_token_trusted';
    var AUTH_DONE_KEY = 'cccoder_trusted_google_auth_done';

    var boot = document.getElementById('boot');
    var frame = document.getElementById('app-frame');
    var googleOpen = document.getElementById('google-open');
    var retryIframe = document.getElementById('retry-iframe');

    function getStoredToken() {
      try { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; } catch (e) { return ''; }
    }
    function storeToken(token) {
      try { localStorage.setItem(TOKEN_STORAGE_KEY, token); } catch (e) {}
    }
    function markAuthDone() {
      try { localStorage.setItem(AUTH_DONE_KEY, '1'); } catch (e) {}
    }
    function hasAuthDone() {
      try { return localStorage.getItem(AUTH_DONE_KEY) === '1'; } catch (e) { return false; }
    }
    function buildFrameUrl() {
      var token = getStoredToken();
      if (!token) return GAS_BASE_URL;
      return GAS_BASE_URL + '?authToken=' + encodeURIComponent(token);
    }
    function showFrame() {
      markAuthDone();
      boot.classList.remove('show');
      frame.style.display = 'block';
      frame.src = buildFrameUrl();
    }

    googleOpen.href = GAS_BASE_URL;
    googleOpen.addEventListener('click', function() {
      markAuthDone();
    });
    retryIframe.addEventListener('click', function() {
      showFrame();
    });

    // 以前認証済みなら、そのまま iframe を試す（バナー非表示）
    if (hasAuthDone() || getStoredToken()) {
      showFrame();
    }

    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'cccoderAuthToken') return;
      if (typeof event.origin === 'string' && event.origin.indexOf('googleusercontent.com') === -1 && event.origin !== 'https://script.google.com') {
        return;
      }
      if (event.data.token) {
        storeToken(event.data.token);
        markAuthDone();
      }
    });
  </script>
</body>
</html>
